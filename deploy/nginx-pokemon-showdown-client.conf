server {
	listen 8080;
	listen [::]:8080;
	server_name _;

	root /var/www/pokemon-showdown-zh;
	index index.html;

	location / {
		try_files $uri $uri/ /index.html;
	}

	# Standalone client login requests. The battle WebSocket connects directly
	# to PS_SERVER_HOST:PS_SERVER_PORT and does not pass through this proxy.
	location ^~ /~~showdown/ {
		proxy_pass https://play.pokemonshowdown.com/~~showdown/;
		proxy_ssl_server_name on;
		proxy_set_header Host play.pokemonshowdown.com;
		proxy_http_version 1.1;
	}

	location = /localization-build.json {
		add_header Cache-Control "no-store";
	}
}
