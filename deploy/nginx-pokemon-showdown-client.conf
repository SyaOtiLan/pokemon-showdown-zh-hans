server {
	listen 8080;
	listen [::]:8080;
	server_name _;

	root /var/www/pokemon-showdown-zh;
	index index.html;

	location / {
		try_files $uri $uri/ /index.html;
	}

	# Local-auth deployments have no public account service. Return the same
	# empty JSON envelope immediately so stale clients cannot hang on an
	# unreachable play.pokemonshowdown.com proxy.
	location ^~ /~~showdown/ {
		default_type application/json;
		return 200 ']null';
	}

	location = /localization-build.json {
		add_header Cache-Control "no-store";
	}
}
