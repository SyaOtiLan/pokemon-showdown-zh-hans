name: localization

permissions:
  contents: write

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run bootstrap
      - run: npm run generate
      - run: npm test
      - run: npm run build
      - run: git diff --exit-code -- release/pokemon-showdown-zh-hans.user.js
      - name: Publish userscript release
        if: startsWith(github.ref, 'refs/tags/v')
        run: gh release create "$GITHUB_REF_NAME" release/pokemon-showdown-zh-hans.user.js --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
